[project]
name = "blastradius-ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranav Achar", email = "achar.pranav@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "node-semver>=0.9.1",
    "numpy>=2.5.2",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
blastradius = "blastradius_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["nodesemver.*"]
ignore_missing_imports = true
